# Her gönderimde ve çekme isteğinde derlenip denenir; APK "Artifacts" altından indirilebilir.
name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Android SDK GitHub'ın Ubuntu makinelerinde hazır kurulu (ANDROID_HOME)
      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Alis-apk
          path: app/build/outputs/apk/release/*.apk
